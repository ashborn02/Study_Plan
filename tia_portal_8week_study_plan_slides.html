      var payload = JSON.parse(document.getElementById('studyhub-payload').textContent);
      var form = document.getElementById('gateForm');
      var input = document.getElementById('gatePassword');
      var remember = document.getElementById('gateRemember');
      var message = document.getElementById('gateMessage');
      var button = document.getElementById('gateButton');

      function fromBase64(text) {
        var binary = atob(text);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }
      function toBase64(bytes) {
        var binary = '';
        for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      }
      function readStored() {
        var raw = null;
        try { raw = localStorage.getItem(STORE) || sessionStorage.getItem(STORE); } catch (e) { raw = null; }
        try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
      }
      function forget() {
        try { localStorage.removeItem(STORE); } catch (e) {}
        try { sessionStorage.removeItem(STORE); } catch (e) {}
      }
      function decrypt(key) {
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: fromBase64(payload.iv) }, key, fromBase64(payload.ct)
        ).then(function (plain) { return new TextDecoder().decode(plain); });
      }
      function render(html) {
        document.open();
        document.write(html);
        document.close();
      }
      function showForm() {
        document.body.classList.remove('checking');
        input.focus();
      }

      if (!window.crypto || !crypto.subtle) {
        document.body.classList.remove('checking');
        message.textContent = 'This browser cannot unlock the page (needs HTTPS and a modern browser).';
        button.disabled = true;
        return;
      }

      var stored = readStored();
      if (stored && stored.salt === payload.salt && stored.key) {
        crypto.subtle.importKey('raw', fromBase64(stored.key), 'AES-GCM', false, ['decrypt'])
          .then(decrypt)
          .then(render)
          .catch(function () { forget(); showForm(); });
      } else {
        showForm();
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!input.value) return;
        button.disabled = true;
        message.textContent = 'Unlocking…';
        var derivedKey;
        crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey'])
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: payload.iter, hash: 'SHA-256' },
              base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
            );
          })
          .then(function (key) { derivedKey = key; return decrypt(key); })
          .then(function (html) {
            return crypto.subtle.exportKey('raw', derivedKey).then(function (raw) {
              var record = JSON.stringify({ salt: payload.salt, key: toBase64(new Uint8Array(raw)) });
              try {
                forget();
                (remember.checked ? localStorage : sessionStorage).setItem(STORE, record);
              } catch (e) {}
              render(html);
            });
          })
          .catch(function () {
            button.disabled = false;
            message.textContent = 'Wrong password.';
            input.select();
          });
      });
    })();</script>
</body>
</html>
